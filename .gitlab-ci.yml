# The same checks as .github/workflows/test.yml. The real-model job is manual: it downloads about 1.2 GB.
stages: [test, publish]

logic:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest tests.test_quickstart -v

real-model:
  stage: test
  image: python:3.12-slim
  when: manual
  allow_failure: true
  script:
    - pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
    - pip install -r requirements.txt
    - python -m tests.smoke

# Publishes main to GitHub. Nothing is pushed until a person presses play on this job, and it never force-pushes.
# One-off setup, by the repository owner:
#   1. ssh-keygen -t ed25519 -N "" -C obi-lookout-quickstart-publish -f github-deploy-key
#   2. GitHub repo > Settings > Deploy keys > add github-deploy-key.pub, tick "Allow write access"
#   3. GitLab project > Settings > CI/CD > Variables > add GITHUB_DEPLOY_KEY: type File, the private key, Protected
#   4. Delete the local key files.
publish_github:
  stage: publish
  image: alpine:3.20
  needs: [logic]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
  variables:
    GIT_DEPTH: "0"   # a shallow clone cannot be pushed to an empty repository
    GITHUB_REPO: git@github.com:obiguard/obi-lookout-quickstart.git
  script:
    - test -n "$GITHUB_DEPLOY_KEY" || { echo "GITHUB_DEPLOY_KEY is not set (protected File variable)" >&2; exit 1; }
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_DEPLOY_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    # Trust GitHub's host key only if it matches the fingerprint GitHub publishes (docs.github.com, "GitHub's SSH key fingerprints").
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
    - ssh-keygen -lf ~/.ssh/known_hosts | grep -q "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" || { echo "GitHub host key does not match the published fingerprint" >&2; exit 1; }
    - git push "$GITHUB_REPO" "$CI_COMMIT_SHA:refs/heads/main"
